{% extends "base.html" %}

{% block content %}

<div class="hero">

    <div class="form-card">

        <h1>💪 FitBuddy - AI Workout Generator</h1>

        <p class="subtitle">
            Generate your personalized AI-powered fitness plan
        </p>

        <form action="/generate" method="post">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="user_id">User ID</label>
            <input
                type="text"
                id="user_id"
                name="user_id"
                placeholder="Enter User ID"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                placeholder="Enter age"
                required
            >

            <label for="weight">Weight (kg)</label>
            <input
                type="number"
                id="weight"
                name="weight"
                step="0.1"
                placeholder="Enter weight"
                required
            >

            <label for="goal">Fitness Goal</label>
            <input
                type="text"
                id="goal"
                name="goal"
                placeholder="e.g. Weight loss, Muscle gain, Flexibility"
                required
            >

            <label for="intensity">Workout Intensity</label>

            <select id="intensity" name="intensity" required>
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>

            <button type="submit">
                Generate Plan
            </button>

        </form>

    </div>

</div>

{% endblock %}
